# Beeline on a public server, with Kamal: email sign-in, the landing page,
# and HTTPS from Let's Encrypt.
#
#   bin/kamal setup    # the first time
#   bin/kamal deploy   # after that
#
# Secrets come from .kamal/secrets. See README.md, "Deploying with Kamal".

service: beeline
image: beeline

servers:
  web:
    - 89.167.89.0

# Kamal connects as the app user (key only; root can't log in).
ssh:
  user: app
  keys: [ "~/.ssh/beeline-hetzner" ]

# Let's Encrypt certificates for each host. www redirects to the bare domain
# (config/routes.rb). The sslip.io name (which resolves to the server's IP)
# keeps working for apps built before the domain.
proxy:
  ssl: true
  hosts:
    - beeline.ink
    - www.beeline.ink
    - 89-167-89-0.sslip.io

# Images are pushed straight to the server over SSH: no registry account.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - RESEND_API_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_FORCE_SSL: true
    BEELINE_MODE: prod # email sign-in and the landing page
    BEELINE_HOST: beeline.ink
    BEELINE_MAIL_FROM: Beeline <hello@beeline.ink> # beeline.ink is verified with Resend

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "beeline_storage:/rails/storage"
  # The Mac app download, uploaded by bin/package-desktop-app --upload.
  - "/home/app/downloads:/rails/public/downloads:ro"

asset_path: /rails/public/assets

# Build what's on disk (minus .dockerignore), committed or not. Drop `context`
# to build only what's committed.
builder:
  arch: arm64
  context: .
